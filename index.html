<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Styled Player</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- Video.js CDN CSS -->
  <link href="https://vjs.zencdn.net/8.22.0/video-js.css" rel="stylesheet" />

  <style>
    .video-js {
      width: 90%;
      max-width: 900px;
      margin: 40px auto;
      font-size: 14px;
    }
    .vjs-default-skin .vjs-big-play-button {
      background-color: #0f1819 !important;
      color: white !important;
      border-radius: 50% !important;
      width: 60px !important;
      height: 60px !important;
      font-size: 2em !important;
      line-height: 60px !important;
      left: 50% !important;
      top: 50% !important;
      transform: translate(-50%, -50%) !important;
      border: none !important;
    }
    .video-js .vjs-control-bar {
      background-color: #0f1819 !important;
      justify-content: center !important;
    }
  </style>
</head>

<body>

  <video
    id="custom-video"
    class="video-js vjs-default-skin"
    controls
    preload="auto"
    poster="https://video.oakwood.marketing/oakwood/videoframe_4814.png"
    data-setup="{}">
    <source src="https://video.oakwood.marketing/oakwood/EvanTestimonialVideo.mp4" type="video/mp4" />
    <p class="vjs-no-js">
      To view this video please enable JavaScript and consider upgrading to a
      browser that <a href="https://videojs.com/html5-video-support/">supports HTML5 video</a>.
    </p>
  </video>

  <script src="https://vjs.zencdn.net/8.22.0/video.min.js"></script>
  <script>
    videojs('custom-video');
  </script>

</body>
</html>
